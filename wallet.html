<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wallet | Secure Tracking</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0ea5e9;
            --primary-green: #22c55e;
            --bg: #0f172a;
            --text: #ffffff;
            --card: rgba(15, 23, 42, 0.75);
            --border: rgba(255, 255, 255, 0.1);
            --muted: #94a3b8;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.8)), url('/static/bg.png') no-repeat center center fixed; background-size: cover;
            min-height: 100vh; margin: 0; padding: 2rem; color: var(--text);
            display: flex; justify-content: center; align-items: center;
        }
        .container { width: 100%; max-width: 500px; animation: slideUp 0.6s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        
        .card {
            background: var(--card); backdrop-filter: blur(12px);
            padding: 3rem; border-radius: 40px; border: 1px solid var(--border);
            text-align: center; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative; overflow: hidden;
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .back-link { text-decoration: none; color: var(--primary-blue); font-weight: 600; display: flex; align-items: center; gap: 0.5rem; transition: 0.3s; }
        .back-link:hover { transform: translateX(-5px); }
        
        .wallet-icon { font-size: 3rem; margin-bottom: 1rem; display: inline-block; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        
        .balance-label { font-size: 0.85rem; color: #94a3b8; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1rem; margin-bottom: 0.5rem; }
        .balance-amount { font-size: 4rem; font-weight: 800; color: var(--text); margin: 0; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .currency { font-size: 1.5rem; color: var(--primary-green); margin-top: 1rem; }
        
        .action-card {
            margin-top: 2rem; padding: 1.5rem; border-radius: 24px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border); display: flex; align-items: center; gap: 1rem;
        }
        .info-msg { font-size: 0.9rem; color: #94a3b8; margin-top: 2rem; line-height: 1.6; }
        
        #refresh-btn { 
            background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--primary-blue); 
            padding: 8px; border-radius: 50%; transition: 0.3s;
        }
        #refresh-btn:hover { background: rgba(14, 165, 233, 0.1); transform: rotate(180deg); }

        /* Compact Splash Screen */
        .splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
        }
        .splash-pill {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.15), rgba(16, 185, 129, 0.15));
            border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(20px);
            border-radius: 100px; padding: 1.8rem 3.5rem;
            display: flex; align-items: center; gap: 1.5rem;
            box-shadow: 0 30px 80px -10px rgba(14, 165, 233, 0.25);
            animation: splashEnter 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative; overflow: hidden; z-index: 1;
        }
        @keyframes splashEnter { from { opacity: 0; transform: scale(0.8) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .splash-pill::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(14, 165, 233, 0.15), transparent, rgba(16, 185, 129, 0.15), transparent);
            animation: splashSpin 3s linear infinite;
        }
        @keyframes splashSpin { to { transform: rotate(360deg); } }
        .splash-icon {
            width: 48px; height: 48px; border-radius: 16px; position: relative; z-index: 1;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-green));
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 20px rgba(14, 165, 233, 0.4);
            animation: iconPulse 2s infinite ease-in-out;
        }
        @keyframes iconPulse { 0%, 100% { box-shadow: 0 8px 20px rgba(14, 165, 233, 0.4); } 50% { box-shadow: 0 8px 30px rgba(14, 165, 233, 0.7); } }
        .splash-text { position: relative; z-index: 1; }
        .splash-brand { color: white; font-weight: 900; font-size: 1.3rem; letter-spacing: 0.1rem; text-transform: uppercase; margin: 0; }
        .splash-sub { color: var(--muted); font-size: 0.7rem; letter-spacing: 0.15rem; text-transform: uppercase; margin-top: 4px; }
        .splash-dots { display: flex; gap: 6px; margin-top: 6px; }
        .splash-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--primary-blue); animation: dotBounce 1.2s infinite ease-in-out; }
        .splash-dots span:nth-child(2) { animation-delay: 0.2s; }
        .splash-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotBounce { 0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1.2); } }
        .splash-hidden { opacity: 0; visibility: hidden; }
        .splash-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; filter: brightness(0.15) saturate(1.5); z-index: 0;
        }
    </style>
</head>
<body>
    <div id="splash-screen" class="splash-screen">
        <video autoplay muted loop playsinline class="splash-video">
            <source src="/static/splash.mp4" type="video/mp4">
        </video>
        <div class="splash-pill">
            <div class="splash-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"/><circle cx="12" cy="10" r="3"/></svg>
            </div>
            <div class="splash-text">
                <div class="splash-brand">Secure Track</div>
                <div class="splash-sub">Initializing System</div>
                <div class="splash-dots"><span></span><span></span><span></span></div>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="header">
            <a href="/" class="back-link">← Back to Tracking</a>
        </div>
        <div class="card">
            <div class="wallet-icon">💳</div>
            <div class="balance-label">Current Balance</div>
            <div class="balance-amount">
                <span class="currency">₹</span>
                <span id="balance">0.00</span>
                <button id="refresh-btn" onclick="loadBalance()" title="Refresh Balance">↻</button>
            </div>
            
            <div class="action-card">
                <div style="font-size: 1.5rem;">🔋</div>
                <div style="text-align: left;">
                    <div style="font-size: 0.85rem; font-weight: 700; color: var(--text);">Ready for Tolls</div>
                    <div style="font-size: 0.75rem; color: var(--muted);">Your wallet is automatically debited at checkpoints.</div>
                </div>
            </div>

            <p class="info-msg">
                To add funds, please visit any authorized admin desk. <br>
                Provide your <b>Username</b> and <b>Aadhar Number</b> to recharge.
            </p>
        </div>
    </div>

    <script>
        async function loadBalance() {
            const btn = document.getElementById('refresh-btn');
            btn.style.opacity = '0.5';
            try {
                const res = await fetch('/api/get_target');
                const data = await res.json();
                if (data.balance !== undefined) {
                    document.getElementById('balance').innerText = data.balance.toFixed(2);
                }
            } catch (e) {}
            setTimeout(() => btn.style.opacity = '1', 500);
        }
        window.onload = () => {
            loadBalance();
            const splash = document.getElementById('splash-screen');
            setTimeout(() => {
                splash.classList.add('splash-hidden');
            }, 1500);
        };
    </script>
</body>
</html>
