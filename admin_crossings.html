<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Road Crossing Monitor | Secure Tracking</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --primary-blue: #0ea5e9;
            --primary-green: #22c55e;
            --bg: #0f172a;
            --text: #ffffff;
            --card: rgba(15, 23, 42, 0.78);
            --border: rgba(255, 255, 255, 0.1);
            --muted: #94a3b8;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(rgba(15, 23, 42, 0.72), rgba(15, 23, 42, 0.84)), url('/static/bg.png') no-repeat center center fixed;
            background-size: cover; color: var(--text); margin: 0; padding: 2rem; min-height: 100vh;
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; gap: 1rem; }
        .header-actions { display: flex; gap: 0.75rem; align-items: center; }
        .link-btn {
            color: var(--primary-blue); text-decoration: none; font-weight: 700; font-size: 0.9rem;
            padding: 10px 14px; border: 1px solid var(--border); border-radius: 12px; background: rgba(255,255,255,0.04);
        }
        .logout { color: #fecaca; background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.25); }
        h1 { margin: 0; font-size: 2rem; }
        .filters {
            background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 1rem;
            display: grid; grid-template-columns: 1fr 1fr auto; gap: 1rem; align-items: end; backdrop-filter: blur(12px);
            margin-bottom: 1.5rem;
        }
        label { display: block; font-size: 0.75rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05rem; margin-bottom: 0.4rem; }
        input, select {
            width: 100%; box-sizing: border-box; padding: 12px; border-radius: 14px; border: 1px solid var(--border);
            background: rgba(255,255,255,0.06); color: var(--text); font-family: inherit; font-size: 0.95rem;
        }
        option { color: #0f172a; }
        input:focus, select:focus { outline: none; border-color: var(--primary-blue); background: rgba(255,255,255,0.1); }
        .btn {
            border: none; border-radius: 14px; padding: 13px 18px; cursor: pointer; color: white; font-weight: 800;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-green)); font-family: inherit;
        }
        .layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 1.5rem; align-items: start; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 1.25rem; backdrop-filter: blur(12px); }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 760px; }
        th { text-align: left; color: var(--muted); padding: 0.9rem; border-bottom: 2px solid var(--border); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05rem; }
        td { padding: 0.9rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        .badge { display: inline-block; padding: 6px 10px; border-radius: 10px; background: rgba(34,197,94,0.16); color: #86efac; border: 1px solid rgba(34,197,94,0.28); font-weight: 800; font-size: 0.72rem; }
        .maps-link { color: var(--primary-blue); font-weight: 700; text-decoration: none; }
        #crossing-map { height: 520px; border-radius: 18px; overflow: hidden; background: var(--bg); border: 1px solid var(--border); }
        .meta { display: flex; justify-content: space-between; gap: 1rem; color: var(--muted); font-size: 0.85rem; margin-bottom: 1rem; }
        .empty { text-align: center; color: var(--muted); padding: 2rem; }
        @media (max-width: 960px) {
            body { padding: 1rem; }
            .filters, .layout { grid-template-columns: 1fr; }
            .header { flex-direction: column; align-items: flex-start; }
            .header-actions { flex-wrap: wrap; }
            #crossing-map { height: 360px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>Road Crossing Monitor</h1>
            <div style="color: var(--muted); margin-top: 0.35rem;">Users detected inside marked road segments.</div>
        </div>
        <div class="header-actions">
            <a href="/admin" class="link-btn">Back to Dashboard</a>
            <a href="/api/logout" class="link-btn logout">Logout</a>
        </div>
    </div>

    <div class="filters">
        <div>
            <label>Road</label>
            <select id="road-filter" onchange="loadCrossings()">
                <option value="">All marked roads</option>
            </select>
        </div>
        <div>
            <label>Search User</label>
            <input type="search" id="user-search" placeholder="Type username" oninput="queueSearch()">
        </div>
        <button class="btn" onclick="loadCrossings()">Refresh</button>
    </div>

    <div class="layout">
        <div class="card">
            <div class="meta">
                <span id="result-count">0 records</span>
                <span id="last-updated">Not loaded</span>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Road</th>
                            <th>Latitude</th>
                            <th>Longitude</th>
                            <th>Time</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="crossings-table"></tbody>
                </table>
            </div>
            <div id="empty-state" class="empty" style="display: none;">No crossing records match the selected filters.</div>
        </div>

        <div class="card">
            <div class="meta">
                <span>Map View</span>
                <span>Latest 500</span>
            </div>
            <div id="crossing-map"></div>
        </div>
    </div>

    <script>
        let crossingMap;
        let crossingLayer = L.featureGroup();
        let searchTimer;

        function initMap() {
            crossingMap = L.map('crossing-map', { zoomControl: true, attributionControl: false }).setView([13.0827, 80.2707], 11);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(crossingMap);
            crossingLayer.addTo(crossingMap);
        }

        function queueSearch() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(loadCrossings, 250);
        }

        async function loadRoads() {
            try {
                const res = await fetch('/api/crossing_roads');
                const roads = await res.json();
                const select = document.getElementById('road-filter');
                select.innerHTML = '<option value="">All marked roads</option>' + roads.map(road => (
                    `<option value="${escapeHtml(road)}">${escapeHtml(road)}</option>`
                )).join('');
            } catch (e) {}
        }

        async function loadCrossings() {
            const road = document.getElementById('road-filter').value;
            const search = document.getElementById('user-search').value.trim();
            const params = new URLSearchParams();
            if (road) params.set('road', road);
            if (search) params.set('search', search);

            try {
                const res = await fetch(`/api/crossings?${params.toString()}`);
                const data = await res.json();
                renderCrossings(data);
            } catch (e) {
                document.getElementById('empty-state').style.display = 'block';
            }
        }

        function renderCrossings(data) {
            const tbody = document.getElementById('crossings-table');
            const empty = document.getElementById('empty-state');
            document.getElementById('result-count').innerText = `${data.length} record${data.length === 1 ? '' : 's'}`;
            document.getElementById('last-updated').innerText = `Updated ${new Date().toLocaleTimeString()}`;

            tbody.innerHTML = data.map(loc => `
                <tr>
                    <td style="font-weight: 800;">${escapeHtml(loc.username || 'System')}</td>
                    <td><span class="badge">${escapeHtml(loc.road_name || 'Marked Road')}</span></td>
                    <td>${Number(loc.latitude).toFixed(6)}</td>
                    <td>${Number(loc.longitude).toFixed(6)}</td>
                    <td style="color: var(--muted);">${new Date(loc.timestamp).toLocaleString()}</td>
                    <td><a class="maps-link" href="https://www.google.com/maps?q=${loc.latitude},${loc.longitude}" target="_blank">View Map</a></td>
                </tr>
            `).join('');
            empty.style.display = data.length ? 'none' : 'block';

            crossingLayer.clearLayers();
            data.forEach(loc => {
                L.circleMarker([loc.latitude, loc.longitude], {
                    radius: 7,
                    color: '#22c55e',
                    fillColor: '#22c55e',
                    fillOpacity: 0.75
                }).bindPopup(`<b>${escapeHtml(loc.username || 'System')}</b><br>${escapeHtml(loc.road_name || 'Marked Road')}<br>${new Date(loc.timestamp).toLocaleString()}`).addTo(crossingLayer);
            });
            if (data.length) {
                crossingMap.fitBounds(crossingLayer.getBounds(), { padding: [35, 35], maxZoom: 15 });
            }
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[char]));
        }

        initMap();
        loadRoads();
        loadCrossings();
        setInterval(loadCrossings, 10000);
    </script>
</body>
</html>
