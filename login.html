<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Secure Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0ea5e9;
            --primary-green: #10b981;
            --bg: #0f172a;
            --text: #ffffff;
            --card: rgba(15, 23, 42, 0.75);
            --border: rgba(255, 255, 255, 0.1);
            --muted: #94a3b8;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.85)), url('/static/bg.png') no-repeat center center fixed;
            background-size: cover;
            display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: var(--text);
            overflow: hidden;
        }
        .card {
            background: var(--card); backdrop-filter: blur(16px);
            padding: 3rem; border-radius: 40px; border: 1px solid var(--border);
            width: 100%; max-width: 420px; text-align: center;
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.5);
            animation: cardEnter 1s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }
        @keyframes cardEnter {
            from { opacity: 0; transform: scale(0.95) translateY(30px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .logo-container {
            width: 64px; height: 64px; background: linear-gradient(135deg, var(--primary-blue), var(--primary-green));
            margin: 0 auto 1.5rem; border-radius: 20px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 20px -5px rgba(14, 165, 233, 0.4);
            animation: logoPulse 2s infinite ease-in-out;
        }
        @keyframes logoPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .tabs { display: flex; margin-bottom: 2rem; gap: 0.5rem; padding: 5px; background: rgba(255,255,255,0.06); border-radius: 18px; border: 1px solid var(--border); }
        .tab { flex: 1; padding: 10px; cursor: pointer; color: var(--muted); font-weight: 700; font-size: 0.9rem; border-radius: 14px; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .tab.active { background: linear-gradient(135deg, var(--primary-blue), var(--primary-green)); color: white; box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3); }
        
        .input-group { text-align: left; margin-bottom: 1rem; transform: translateY(0); transition: 0.3s; }
        .input-group:focus-within { transform: translateY(-2px); }
        
        label { font-size: 0.75rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05rem; margin-left: 12px; }
        
        input, select {
            width: 100%; padding: 14px 18px; margin-top: 6px; border-radius: 18px; border: 1px solid var(--border);
            background: rgba(255,255,255,0.05); color: var(--text); box-sizing: border-box; font-family: inherit; font-size: 0.95rem;
            transition: all 0.3s;
        }
        input::placeholder, select::placeholder { color: #475569; }
        input:focus, select:focus { border-color: var(--primary-blue); outline: none; background: rgba(255,255,255,0.1); box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.15); }
        
        button {
            width: 100%; background: linear-gradient(135deg, var(--primary-blue), var(--primary-green)); 
            color: white; border: none; padding: 16px;
            border-radius: 18px; cursor: pointer; font-weight: 800; margin-top: 24px; transition: 0.4s;
            box-shadow: 0 15px 30px -10px rgba(14, 165, 233, 0.4);
            font-size: 1rem; letter-spacing: 0.02rem;
        }
        button:hover { transform: translateY(-3px); box-shadow: 0 20px 40px -10px rgba(14, 165, 233, 0.5); }
        button:active { transform: translateY(0); }
        
        h2 { color: var(--text); }
        .error { color: #f87171; font-size: 0.85rem; margin-top: 15px; font-weight: 700; animation: shake 0.4s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .success { color: var(--primary-green); font-size: 0.85rem; margin-top: 15px; font-weight: 700; }
        
        .form-section { display: none; }
        .form-section.active { display: block; animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Compact Splash Screen */
        .splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
        }
        .splash-pill {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.15), rgba(16, 185, 129, 0.15));
            border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(20px);
            border-radius: 100px; padding: 1.8rem 3.5rem;
            display: flex; align-items: center; gap: 1.5rem;
            box-shadow: 0 30px 80px -10px rgba(14, 165, 233, 0.25);
            animation: splashEnter 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative; overflow: hidden;
        }
        @keyframes splashEnter { from { opacity: 0; transform: scale(0.8) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .splash-pill::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(14, 165, 233, 0.15), transparent, rgba(16, 185, 129, 0.15), transparent);
            animation: splashSpin 3s linear infinite;
        }
        @keyframes splashSpin { to { transform: rotate(360deg); } }
        .splash-icon {
            width: 48px; height: 48px; border-radius: 16px; position: relative; z-index: 1;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-green));
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 20px rgba(14, 165, 233, 0.4);
            animation: iconPulse 2s infinite ease-in-out;
        }
        @keyframes iconPulse { 0%, 100% { box-shadow: 0 8px 20px rgba(14, 165, 233, 0.4); } 50% { box-shadow: 0 8px 30px rgba(14, 165, 233, 0.7); } }
        .splash-text { position: relative; z-index: 1; }
        .splash-brand { color: white; font-weight: 900; font-size: 1.3rem; letter-spacing: 0.1rem; text-transform: uppercase; margin: 0; }
        .splash-sub { color: var(--muted); font-size: 0.7rem; letter-spacing: 0.15rem; text-transform: uppercase; margin-top: 4px; }
        .splash-dots { display: flex; gap: 6px; margin-top: 6px; }
        .splash-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--primary-blue); animation: dotBounce 1.2s infinite ease-in-out; }
        .splash-dots span:nth-child(2) { animation-delay: 0.2s; }
        .splash-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotBounce { 0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1.2); } }
        .splash-hidden { opacity: 0; visibility: hidden; }
        
        .splash-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; filter: brightness(0.15) saturate(1.5); z-index: 0;
        }
        .splash-pill { z-index: 1; }
    </style>
</head>
<body>
    <div id="splash-screen" class="splash-screen">
        <video autoplay muted loop playsinline class="splash-video">
            <source src="/static/splash.mp4" type="video/mp4">
        </video>
        <div class="splash-pill">
            <div class="splash-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"/><circle cx="12" cy="10" r="3"/></svg>
            </div>
            <div class="splash-text">
                <div class="splash-brand">Secure Track</div>
                <div class="splash-sub">Initializing System</div>
                <div class="splash-dots"><span></span><span></span><span></span></div>
            </div>
        </div>
    </div>
    <div class="card">
        <div class="logo-container">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"/><circle cx="12" cy="10" r="3"/></svg>
        </div>
        <div class="tabs">
            <div id="tab-login" class="tab active" onclick="showForm('login')">Login</div>
            <div id="tab-register" class="tab" onclick="showForm('register')">Register</div>
        </div>

        <div id="login-form" class="form-section active">
            <h2>Secure Login</h2>
            <p style="color: var(--muted); font-size: 0.95rem; margin-bottom: 2rem;">Sign in to management portal</p>
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter your username">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password">
            </div>
            <div id="login-error" class="error"></div>
            <button onclick="login()">Sign In</button>
        </div>

        <div id="register-form" class="form-section">
            <h2>Account Registration</h2>
            <p style="color: var(--muted); font-size: 0.95rem; margin-bottom: 2rem;">Create your secure user profile</p>
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="reg-username" placeholder="Username">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="reg-password" placeholder="Password">
            </div>
            <div style="display: flex; gap: 1rem;">
                <div class="input-group" style="flex: 1;">
                    <label>Number Plate</label>
                    <input type="text" id="reg-plate" placeholder="AB 12 CD 3456">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>Vehicle Type</label>
                    <select id="reg-type">
                        <option value="" disabled selected>Select type</option>
                        <option value="Car">Car</option>
                        <option value="Truck">Truck</option>
                        <option value="Bike">Bike</option>
                        <option value="Bus">Bus</option>
                    </select>
                </div>
            </div>
            <div class="input-group">
                <label>Phone Number</label>
                <input type="tel" id="reg-phone" placeholder="+91 00000 00000">
            </div>
            <div class="input-group">
                <label>Aadhar Number</label>
                <input type="text" id="reg-aadhar" placeholder="12 Digit Identification">
            </div>
            <div id="reg-msg" class="error"></div>
            <button onclick="register()">Complete Registration</button>
        </div>
    </div>

    <script>
        function showForm(type) {
            document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(type + '-form').classList.add('active');
            document.getElementById('tab-' + type).classList.add('active');
        }

        async function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const error = document.getElementById('login-error');
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                const data = await res.json();
                if (res.ok) { window.location.href = data.redirect || '/'; }
                else { error.innerText = data.message; }
            } catch (err) { error.innerText = "Connection failed"; }
        }

        async function register() {
            const msg = document.getElementById('reg-msg');
            const data = {
                username: document.getElementById('reg-username').value,
                password: document.getElementById('reg-password').value,
                number_plate: document.getElementById('reg-plate').value,
                vehicle_type: document.getElementById('reg-type').value,
                phone: document.getElementById('reg-phone').value,
                aadhar: document.getElementById('reg-aadhar').value
            };
            if (!data.username || !data.password || !data.number_plate || !data.phone || !data.aadhar) {
                msg.innerText = "All fields are required"; msg.className = "error"; return;
            }
            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (res.ok) { msg.innerText = "Registration Successful. Redirecting to login..."; msg.className = "success"; setTimeout(() => showForm('login'), 2000); }
                else { msg.innerText = result.message; msg.className = "error"; }
            } catch (err) { msg.innerText = "System connection failure"; msg.className = "error"; }
        }

        window.addEventListener('load', () => {
            const splash = document.getElementById('splash-screen');
            setTimeout(() => { splash.classList.add('splash-hidden'); }, 1500);
        });
    </script>
</body>
</html>
