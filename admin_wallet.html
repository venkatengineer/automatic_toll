<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Recharge Portal | Secure Tracking</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0ea5e9;
            --primary-green: #22c55e;
            --bg: #0f172a;
            --text: #ffffff;
            --card: rgba(15, 23, 42, 0.75);
            --border: rgba(255, 255, 255, 0.1);
            --muted: #94a3b8;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.8)), url('/static/bg.png') no-repeat center center fixed; background-size: cover;
            min-height: 100vh; margin: 0; padding: 2rem; color: var(--text);
            display: flex; justify-content: center; align-items: center;
        }
        .container { width: 100%; max-width: 600px; animation: slideIn 0.5s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }
        
        .card {
            background: var(--card); border-radius: 32px; padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); backdrop-filter: blur(12px);
            border: 1px solid var(--border);
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .back-link { text-decoration: none; color: var(--primary-blue); font-weight: 600; font-size: 0.9rem; }
        
        h2 { margin: 0 0 1.5rem 0; font-weight: 800; color: var(--text); font-size: 1.8rem; }
        
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.8rem; font-weight: 700; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05rem; }
        input {
            width: 100%; padding: 14px; border-radius: 16px; border: 1px solid var(--border);
            background: rgba(255,255,255,0.05); color: var(--text); box-sizing: border-box; font-size: 1rem;
            transition: 0.3s;
        }
        input:focus { border-color: var(--primary-blue); outline: none; background: rgba(255,255,255,0.1); box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.1); }
        
        .btn-recharge {
            width: 100%; background: linear-gradient(135deg, var(--primary-blue), var(--primary-green));
            color: white; border: none; padding: 16px; border-radius: 16px; font-weight: 700;
            cursor: pointer; transition: 0.3s; margin-top: 1rem; font-size: 1rem;
            box-shadow: 0 10px 15px -3px rgba(14, 165, 233, 0.3);
        }
        .btn-recharge:hover { transform: scale(1.02); box-shadow: 0 15px 20px -3px rgba(14, 165, 233, 0.4); }
        .btn-recharge:active { transform: scale(0.98); }
        
        #recharge-status { 
            margin-top: 1.5rem; padding: 1rem; border-radius: 16px; font-size: 0.9rem; 
            text-align: center; display: none; font-weight: 600;
        }
        .status-success { display: block !important; background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
        .status-error { display: block !important; background: rgba(248,113,113,0.15); color: #f87171; border: 1px solid rgba(248,113,113,0.3); }
        
        .summary-box {
            margin-top: 2rem; padding: 1.5rem; border-radius: 20px; background: rgba(255,255,255,0.05);
            border: 1px dashed var(--border);
        }
        .summary-box div { color: #94a3b8 !important; }

        /* Compact Splash Screen */
        .splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
        }
        .splash-pill {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.15), rgba(16, 185, 129, 0.15));
            border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(20px);
            border-radius: 100px; padding: 1.8rem 3.5rem;
            display: flex; align-items: center; gap: 1.5rem;
            box-shadow: 0 30px 80px -10px rgba(14, 165, 233, 0.25);
            animation: splashEnter 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative; overflow: hidden; z-index: 1;
        }
        @keyframes splashEnter { from { opacity: 0; transform: scale(0.8) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .splash-pill::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(14, 165, 233, 0.15), transparent, rgba(16, 185, 129, 0.15), transparent);
            animation: splashSpin 3s linear infinite;
        }
        @keyframes splashSpin { to { transform: rotate(360deg); } }
        .splash-icon {
            width: 48px; height: 48px; border-radius: 16px; position: relative; z-index: 1;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-green));
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 20px rgba(14, 165, 233, 0.4);
            animation: iconPulse 2s infinite ease-in-out;
        }
        @keyframes iconPulse { 0%, 100% { box-shadow: 0 8px 20px rgba(14, 165, 233, 0.4); } 50% { box-shadow: 0 8px 30px rgba(14, 165, 233, 0.7); } }
        .splash-text { position: relative; z-index: 1; }
        .splash-brand { color: white; font-weight: 900; font-size: 1.3rem; letter-spacing: 0.1rem; text-transform: uppercase; margin: 0; }
        .splash-sub { color: var(--muted); font-size: 0.7rem; letter-spacing: 0.15rem; text-transform: uppercase; margin-top: 4px; }
        .splash-dots { display: flex; gap: 6px; margin-top: 6px; }
        .splash-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--primary-blue); animation: dotBounce 1.2s infinite ease-in-out; }
        .splash-dots span:nth-child(2) { animation-delay: 0.2s; }
        .splash-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotBounce { 0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1.2); } }
        .splash-hidden { opacity: 0; visibility: hidden; }
        .splash-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; filter: brightness(0.15) saturate(1.5); z-index: 0;
        }
    </style>
</head>
<body>
    <div id="splash-screen" class="splash-screen">
        <video autoplay muted loop playsinline class="splash-video">
            <source src="/static/splash.mp4" type="video/mp4">
        </video>
        <div class="splash-pill">
            <div class="splash-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"/><circle cx="12" cy="10" r="3"/></svg>
            </div>
            <div class="splash-text">
                <div class="splash-brand">Secure Track</div>
                <div class="splash-sub">Initializing System</div>
                <div class="splash-dots"><span></span><span></span><span></span></div>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="header">
            <a href="/admin" class="back-link">← Return to Dashboard</a>
            <div style="font-size: 1.5rem;">🏦</div>
        </div>
        
        <div class="card">
            <h2>Wallet Recharge</h2>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="recharge-user" placeholder="e.g. john_doe">
            </div>
            <div class="form-group">
                <label>Aadhar Number</label>
                <input type="text" id="recharge-aadhar" placeholder="12 digit aadhar number">
            </div>
            <div class="form-group">
                <label>Recharge Amount (₹)</label>
                <input type="number" id="recharge-amount" value="100" min="1">
            </div>
            
            <button class="btn-recharge" onclick="rechargeWallet()">Process Recharge</button>
            <div id="recharge-status"></div>
            
            <div class="summary-box">
                <div style="font-size: 0.75rem; color: var(--muted); font-weight: 700;">ADMIN INSTRUCTIONS</div>
                <div style="font-size: 0.8rem; color: var(--muted); margin-top: 0.5rem; line-height: 1.5;">
                    Verify the user's identity via Aadhar. All transactions are logged and irreversible. Ensure the amount entered is correct before clicking process.
                </div>
            </div>
        </div>
    </div>

    <script>
        async function rechargeWallet() {
            const user = document.getElementById('recharge-user').value;
            const aadhar = document.getElementById('recharge-aadhar').value;
            const amount = document.getElementById('recharge-amount').value;
            const status = document.getElementById('recharge-status');

            if (!user || !aadhar || !amount) {
                status.innerText = "Please fill in all required fields.";
                status.className = "status-error";
                return;
            }

            status.innerText = "Processing transaction...";
            status.className = "status-success";
            status.style.opacity = '0.7';

            try {
                const res = await fetch('/api/recharge', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username: user, aadhar: aadhar, amount: amount })
                });
                const data = await res.json();
                if (res.ok) {
                    status.innerText = `✅ Recharge Successful! ₹${amount} added to ${user}. New balance: ₹${data.new_balance}`;
                    status.className = "status-success";
                    document.getElementById('recharge-user').value = '';
                    document.getElementById('recharge-aadhar').value = '';
                } else {
                    status.innerText = "❌ Transaction Failed: " + data.message;
                    status.className = "status-error";
                }
            } catch (e) {
                status.innerText = "❌ Connection failed. Please check server status.";
                status.className = "status-error";
            }
            status.style.opacity = '1';
        }

        window.addEventListener('load', () => {
            const splash = document.getElementById('splash-screen');
            setTimeout(() => {
                splash.classList.add('splash-hidden');
            }, 1500);
        });
    </script>
</body>
</html>
